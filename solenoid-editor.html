<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solenoid Choreography Editor — Y1–Y12</title>
<style>
  :root{
    --bg:#0e1014; --panel:#181b22; --panel2:#1f232c; --border:#2c313c;
    --text:#d7dce5; --dim:#8a93a3;
    --inner:#34d399; --mid:#60a5fa; --high:#f472b6;
    --accent:#fbbf24;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--text);
    font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; min-height:100vh;
  }
  header{
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--border);
  }
  .grp{display:flex; gap:4px; align-items:center; padding:0 8px; border-right:1px solid var(--border)}
  .grp:last-child{border-right:none}
  button{
    background:var(--panel2); color:var(--text); border:1px solid var(--border);
    border-radius:5px; padding:5px 10px; cursor:pointer; font:inherit;
  }
  button:hover{background:#2a2f3a}
  button:disabled{opacity:.35; cursor:default}
  button.active{background:var(--accent); color:#1a1a1a; border-color:var(--accent); font-weight:600}
  button.play{min-width:70px}
  label.chk{display:flex; align-items:center; gap:5px; cursor:pointer; user-select:none}
  .stat{
    font-variant-numeric:tabular-nums; background:var(--panel2);
    border:1px solid var(--border); border-radius:5px; padding:5px 10px; white-space:nowrap;
  }
  .stat b{color:var(--accent); font-weight:600}
  #scrollerWrap{flex:1; display:flex; flex-direction:column; min-height:0}
  #scroller{
    position:relative; overflow-x:auto; overflow-y:hidden;
    background:var(--bg);
  }
  #cv{position:sticky; left:0; top:0; display:block; cursor:crosshair}
  #spacer{position:absolute; top:0; left:0; height:1px}
  footer{
    padding:6px 12px; background:var(--panel); border-top:1px solid var(--border);
    color:var(--dim); font-size:12px; display:flex; flex-wrap:wrap; gap:14px;
  }
  footer kbd{
    background:var(--panel2); border:1px solid var(--border); border-radius:3px;
    padding:0 4px; font:11px ui-monospace,monospace; color:var(--text);
  }
  .legend{display:flex; gap:10px; align-items:center}
  .sw{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:-1px}
  input[type=file]{display:none}
</style>
</head>
<body>

<header>
  <div class="grp">
    <button id="btnAudio" title="Load WAV/MP3 audio">&#127925; Load audio</button>
    <button id="btnJson" title="Load an existing timeline JSON">&#128194; Load JSON</button>
    <button id="btnExport" title="Download timeline as JSON">&#128190; Export JSON</button>
    <button id="btnClear" title="Clear all activations">Clear</button>
  </div>
  <div class="grp">
    <button id="btnPlay" class="play">&#9654; Play</button>
    <button id="btnStop">&#9632; Stop</button>
  </div>
  <div class="grp">
    <button id="modeToggle" class="active" title="Click flips a cell; drag continues with the same value (1)">Toggle</button>
    <button id="modePaint" title="Drag always turns cells ON (2)">Paint</button>
    <button id="modeErase" title="Drag always turns cells OFF (3)">Erase</button>
  </div>
  <div class="grp">
    <button id="btnUndo" title="Ctrl+Z">&#8630; Undo</button>
    <button id="btnRedo" title="Ctrl+Y">&#8631; Redo</button>
  </div>
  <div class="grp">
    <button id="btnZoomOut" title="Zoom out (Ctrl+wheel)">&minus;</button>
    <span class="stat" id="zoomStat">12 px/frame</span>
    <button id="btnZoomIn" title="Zoom in (Ctrl+wheel)">+</button>
  </div>
  <div class="grp">
    <button id="btnExtend" title="Append 100 empty frames">+10s</button>
    <label class="chk"><input type="checkbox" id="chkPreview">
      <span title="Shift each row by its jet travel delay to preview what the water looks like">&#128167; Water preview</span>
    </label>
  </div>
  <div class="grp">
    <span class="stat">t&nbsp;<b id="timeStat">0:00.0</b></span>
    <span class="stat">frame&nbsp;<b id="frameStat">0</b>&nbsp;/&nbsp;<span id="lenStat">600</span></span>
  </div>
</header>

<div id="scrollerWrap">
  <div id="scroller">
    <canvas id="cv"></canvas>
    <div id="spacer"></div>
  </div>
</div>

<footer>
  <span class="legend">
    <span><span class="sw" style="background:var(--inner)"></span>inner Y5 Y6 Y7 Y10</span>
    <span><span class="sw" style="background:var(--mid)"></span>mids Y1 Y2 Y8 Y9</span>
    <span><span class="sw" style="background:var(--high)"></span>highs Y3 Y4 Y11 Y12</span>
  </span>
  <span><kbd>Space</kbd> play/pause</span>
  <span><kbd>&larr;</kbd><kbd>&rarr;</kbd> step frame (<kbd>Shift</kbd> = 10)</span>
  <span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> mode</span>
  <span><kbd>Ctrl+Z</kbd>/<kbd>Ctrl+Y</kbd> undo/redo</span>
  <span>right-drag always erases &middot; click ruler/waveform to scrub</span>
</footer>

<input type="file" id="fileAudio" accept="audio/*,.wav,.mp3">
<input type="file" id="fileJson" accept=".json,application/json">

<script>
'use strict';

/* ---------- constants ---------- */
const N = 12;                 // solenoids Y1..Y12
const FRAME_S = 0.1;          // 100 ms per frame
const OFFSETS = [68,58,48,48,68,58,78,53,63,82,87,97]; // travel delay in frames, idx 0 = Y1
const MAX_OFFSET = Math.max(...OFFSETS);

const GROUPS = {inner:[4,5,6,9], mid:[0,1,7,8], high:[2,3,10,11]};
const GROUP_COLOR = {inner:'#34d399', mid:'#60a5fa', high:'#f472b6'};
const groupOf = i => GROUPS.inner.includes(i) ? 'inner' : GROUPS.mid.includes(i) ? 'mid' : 'high';

const LABEL_W = 64, RULER_H = 24, WAVE_H = 90, ROW_H = 24;
const GRID_H = ROW_H * N;
const TOTAL_H = RULER_H + WAVE_H + GRID_H;
const MIN_PX = 2, MAX_PX = 48;

/* ---------- state ---------- */
let timeline = Array.from({length: 600}, () => new Array(N).fill(0));
let px = 12;                  // pixels per frame
let mode = 'toggle';          // toggle | paint | erase
let preview = false;          // travel-delay water preview
let undoStack = [], redoStack = [];

let audioCtx = null, audioBuf = null, srcNode = null, peaks = null;
const BUCKET = 256;
let playing = false, playStartCtx = 0, pausedAt = 0;

let drag = null;              // {kind:'edit'|'scrub', ...}

/* ---------- dom ---------- */
const $ = id => document.getElementById(id);
const scroller = $('scroller'), spacer = $('spacer'), cv = $('cv');
const g = cv.getContext('2d');

/* ---------- helpers ---------- */
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const displayFrames = () => timeline.length + (preview ? MAX_OFFSET : 0);
const duration = () => displayFrames() * FRAME_S;

function ensureCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function curTime() { return playing ? audioCtx.currentTime - playStartCtx : pausedAt; }
function curFrame() { return clamp(Math.floor(curTime() / FRAME_S + 1e-6), 0, displayFrames() - 1); }

function fmtTime(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60), d = Math.floor((t * 10) % 10);
  return `${m}:${String(s).padStart(2,'0')}.${d}`;
}

function ensureLength(n) {
  while (timeline.length < n) timeline.push(new Array(N).fill(0));
}

/* ---------- undo / redo ---------- */
const copyTL = tl => tl.map(r => r.slice());
function snapshot() {
  undoStack.push(copyTL(timeline));
  if (undoStack.length > 200) undoStack.shift();
  redoStack.length = 0;
  updateUndoBtns();
}
function undo() {
  if (!undoStack.length) return;
  redoStack.push(copyTL(timeline));
  timeline = undoStack.pop();
  layout(); updateUndoBtns();
}
function redo() {
  if (!redoStack.length) return;
  undoStack.push(copyTL(timeline));
  timeline = redoStack.pop();
  layout(); updateUndoBtns();
}
function updateUndoBtns() {
  $('btnUndo').disabled = !undoStack.length;
  $('btnRedo').disabled = !redoStack.length;
}

/* ---------- transport ---------- */
function stopSrc() {
  if (srcNode) { try { srcNode.stop(); } catch (e) {} srcNode.disconnect(); srcNode = null; }
}
function play() {
  ensureCtx().resume();
  if (pausedAt >= duration() - 1e-6) pausedAt = 0;
  if (audioBuf && pausedAt < audioBuf.duration) {
    srcNode = audioCtx.createBufferSource();
    srcNode.buffer = audioBuf;
    srcNode.connect(audioCtx.destination);
    srcNode.start(0, pausedAt);
  }
  playStartCtx = audioCtx.currentTime - pausedAt;
  playing = true;
  $('btnPlay').innerHTML = '&#10074;&#10074; Pause';
}
function pause() {
  if (!playing) return;
  pausedAt = curTime();
  stopSrc();
  playing = false;
  $('btnPlay').innerHTML = '&#9654; Play';
}
function togglePlay() { playing ? pause() : play(); }
function stopAll() { pause(); pausedAt = 0; scroller.scrollLeft = 0; }
function setTime(t) {
  t = clamp(t, 0, duration());
  const was = playing;
  if (was) { stopSrc(); playing = false; }
  pausedAt = t;
  if (was) play();
}
function stepFrame(d) {
  pause();
  setTime(clamp(Math.round(pausedAt / FRAME_S) + d, 0, displayFrames() - 1) * FRAME_S);
}

/* ---------- file loading ---------- */
async function loadAudioFile(file) {
  try {
    const ab = await file.arrayBuffer();
    audioBuf = await ensureCtx().decodeAudioData(ab);
    buildPeaks(audioBuf);
    ensureLength(Math.ceil(audioBuf.duration / FRAME_S));
    stopAll();
    layout();
  } catch (e) {
    alert('Could not decode audio file: ' + e.message);
  }
}
function buildPeaks(buf) {
  const ch0 = buf.getChannelData(0);
  const ch1 = buf.numberOfChannels > 1 ? buf.getChannelData(1) : null;
  const n = Math.ceil(ch0.length / BUCKET);
  peaks = new Float32Array(n * 2);
  for (let b = 0; b < n; b++) {
    let mn = 1, mx = -1;
    const end = Math.min((b + 1) * BUCKET, ch0.length);
    for (let i = b * BUCKET; i < end; i++) {
      const v = ch1 ? (ch0[i] + ch1[i]) / 2 : ch0[i];
      if (v < mn) mn = v;
      if (v > mx) mx = v;
    }
    peaks[b * 2] = mn; peaks[b * 2 + 1] = mx;
  }
}
async function loadJsonFile(file) {
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data.timeline)) throw new Error('missing "timeline" array');
    const tl = data.timeline.map((fr, i) => {
      if (!fr || !Array.isArray(fr.solenoids)) throw new Error(`frame ${i}: missing "solenoids"`);
      const row = new Array(N).fill(0);
      for (let j = 0; j < N; j++) row[j] = fr.solenoids[j] ? 1 : 0;
      return row;
    });
    if (!tl.length) throw new Error('timeline is empty');
    snapshot();
    timeline = tl;
    if (audioBuf) ensureLength(Math.ceil(audioBuf.duration / FRAME_S));
    stopAll();
    layout();
  } catch (e) {
    alert('Could not load JSON: ' + e.message);
  }
}
function exportJson() {
  const out = { timeline: timeline.map(r => ({ solenoids: r.slice() })) };
  const blob = new Blob([JSON.stringify(out)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'timeline.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ---------- editing ---------- */
/* In water-preview mode the visible column c for row r shows solenoid frame c - OFFSETS[r];
   edits made on screen are mapped back to the underlying solenoid frame. */
function srcFrame(col, row) { return preview ? col - OFFSETS[row] : col; }
function cellOn(col, row) {
  const f = srcFrame(col, row);
  return f >= 0 && f < timeline.length ? timeline[f][row] : 0;
}
function setCell(col, row, val) {
  const f = srcFrame(col, row);
  if (f >= 0 && f < timeline.length) timeline[f][row] = val ? 1 : 0;
}

/* ---------- layout / sizing ---------- */
function layout() {
  const w = scroller.clientWidth || 800;
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(TOTAL_H * dpr);
  cv.style.width = w + 'px';
  cv.style.height = TOTAL_H + 'px';
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  spacer.style.width = (LABEL_W + displayFrames() * px) + 'px';
  $('lenStat').textContent = timeline.length;
  $('zoomStat').textContent = px + ' px/frame';
}

function setZoom(newPx, anchorX) {
  newPx = clamp(newPx, MIN_PX, MAX_PX);
  if (newPx === px) return;
  const ax = anchorX == null ? LABEL_W : anchorX;
  const tAtAnchor = (scroller.scrollLeft + ax - LABEL_W) / px; // in frames
  px = newPx;
  layout();
  scroller.scrollLeft = tAtAnchor * px - (ax - LABEL_W);
}

/* ---------- drawing ---------- */
function frameToX(f) { return LABEL_W + f * px - scroller.scrollLeft; }

function draw() {
  const w = scroller.clientWidth, sl = scroller.scrollLeft;
  const totalF = displayFrames();
  const f0 = clamp(Math.floor(sl / px), 0, totalF);
  const f1 = clamp(Math.ceil((sl + w - LABEL_W) / px) + 1, 0, totalF);
  const t = curTime();
  const cf = curFrame();

  g.clearRect(0, 0, w, TOTAL_H);

  /* --- ruler --- */
  g.fillStyle = '#1a1d24';
  g.fillRect(0, 0, w, RULER_H);
  let labelStep = [1,2,5,10,20,50,100,200,300,600].find(s => s * px >= 56) || 600;
  g.font = '10px ui-monospace,monospace';
  g.textBaseline = 'middle';
  // minor ticks
  const tickStep = px >= 7 ? 1 : 10;
  g.strokeStyle = '#333a47';
  g.beginPath();
  for (let f = Math.ceil(f0 / tickStep) * tickStep; f <= f1; f += tickStep) {
    const x = frameToX(f);
    if (x < LABEL_W) continue;
    g.moveTo(x + .5, RULER_H - 5); g.lineTo(x + .5, RULER_H);
  }
  g.stroke();
  // labels
  g.fillStyle = '#9aa3b5';
  for (let f = Math.ceil(f0 / labelStep) * labelStep; f <= f1; f += labelStep) {
    const x = frameToX(f);
    if (x < LABEL_W + 2) continue;
    g.fillText(fmtTime(f * FRAME_S), x + 3, RULER_H / 2);
    g.fillRect(x, RULER_H - 9, 1, 9);
  }

  /* --- waveform --- */
  const wy = RULER_H;
  g.fillStyle = '#12151b';
  g.fillRect(0, wy, w, WAVE_H);
  if (audioBuf && peaks) {
    const mid = wy + WAVE_H / 2, amp = WAVE_H / 2 - 3;
    const sr = audioBuf.sampleRate, nb = peaks.length / 2;
    g.fillStyle = 'rgba(103,232,249,0.75)';
    for (let x = LABEL_W; x < w; x++) {
      const tA = (sl + x - LABEL_W) / px * FRAME_S;
      const tB = (sl + x + 1 - LABEL_W) / px * FRAME_S;
      if (tA >= audioBuf.duration) break;
      let b0 = Math.floor(tA * sr / BUCKET), b1 = Math.min(Math.ceil(tB * sr / BUCKET), nb);
      let mn = 1, mx = -1;
      for (let b = b0; b < b1; b++) {
        if (peaks[b*2] < mn) mn = peaks[b*2];
        if (peaks[b*2+1] > mx) mx = peaks[b*2+1];
      }
      if (mx < mn) continue;
      const y0 = mid - mx * amp, y1 = mid - mn * amp;
      g.fillRect(x, y0, 1, Math.max(1, y1 - y0));
    }
    g.fillStyle = 'rgba(255,255,255,0.12)';
    g.fillRect(LABEL_W, mid, w - LABEL_W, 1);
  } else {
    g.fillStyle = '#566073';
    g.font = '12px system-ui';
    g.fillText('No audio loaded — click "Load audio" (WAV/MP3). Click here to scrub.', LABEL_W + 12, wy + WAVE_H / 2);
  }

  /* --- grid --- */
  const gy = RULER_H + WAVE_H;
  for (let r = 0; r < N; r++) {
    g.fillStyle = r % 2 ? '#14171d' : '#171a21';
    g.fillRect(0, gy + r * ROW_H, w, ROW_H);
  }
  // second markers
  g.strokeStyle = 'rgba(255,255,255,0.07)';
  g.beginPath();
  for (let f = Math.ceil(f0 / 10) * 10; f <= f1; f += 10) {
    const x = frameToX(f);
    if (x < LABEL_W) continue;
    g.moveTo(x + .5, gy); g.lineTo(x + .5, gy + GRID_H);
  }
  g.stroke();
  // per-frame gridlines when zoomed in
  if (px >= 7) {
    g.strokeStyle = 'rgba(255,255,255,0.03)';
    g.beginPath();
    for (let f = f0; f <= f1; f++) {
      const x = frameToX(f);
      if (x < LABEL_W) continue;
      g.moveTo(x + .5, gy); g.lineTo(x + .5, gy + GRID_H);
    }
    g.stroke();
  }
  // row separators
  g.strokeStyle = 'rgba(255,255,255,0.06)';
  g.beginPath();
  for (let r = 0; r <= N; r++) { g.moveTo(0, gy + r * ROW_H + .5); g.lineTo(w, gy + r * ROW_H + .5); }
  g.stroke();
  // end-of-timeline marker
  const endX = frameToX(timeline.length);
  if (endX >= LABEL_W && endX < w) {
    g.fillStyle = 'rgba(251,191,36,0.5)';
    g.fillRect(endX, gy, 2, GRID_H);
  }
  // active cells
  const gap = px >= 5 ? 1 : 0;
  for (let r = 0; r < N; r++) {
    g.fillStyle = GROUP_COLOR[groupOf(r)];
    const y = gy + r * ROW_H + 2, h = ROW_H - 4;
    let runStart = -1;
    for (let f = f0; f <= f1; f++) {
      const on = f < f1 && cellOn(f, r);
      if (on && runStart < 0) runStart = f;
      if (!on && runStart >= 0) {
        const x = Math.max(frameToX(runStart), LABEL_W);
        const xe = frameToX(f) - gap;
        if (xe > x) g.fillRect(x, y, xe - x, h);
        runStart = -1;
      }
      if (on && gap && px >= 7) { // draw cell-by-cell with gaps when zoomed in
        const x = frameToX(f);
        if (x + px > LABEL_W) g.fillRect(Math.max(x, LABEL_W), y, px - gap, h);
        runStart = -1;
      }
    }
  }

  /* --- playhead --- */
  const colX = frameToX(cf);
  if (colX + px > LABEL_W) {
    g.fillStyle = 'rgba(255,255,255,0.12)';
    g.fillRect(Math.max(colX, LABEL_W), gy, px, GRID_H);
  }
  const phx = frameToX(t / FRAME_S);
  if (phx >= LABEL_W) {
    g.fillStyle = '#ef4444';
    g.fillRect(phx, 0, 1.5, TOTAL_H);
    g.beginPath();
    g.moveTo(phx - 5, 0); g.lineTo(phx + 6, 0); g.lineTo(phx + .5, 8);
    g.closePath(); g.fill();
  }

  /* --- left label panel (drawn last, on top) --- */
  g.fillStyle = '#1a1d24';
  g.fillRect(0, 0, LABEL_W, TOTAL_H);
  g.strokeStyle = '#2c313c';
  g.beginPath(); g.moveTo(LABEL_W + .5, 0); g.lineTo(LABEL_W + .5, TOTAL_H); g.stroke();
  g.font = 'bold 11px system-ui';
  g.textBaseline = 'middle';
  for (let r = 0; r < N; r++) {
    const y = gy + r * ROW_H + ROW_H / 2;
    g.fillStyle = GROUP_COLOR[groupOf(r)];
    g.fillRect(4, gy + r * ROW_H + 5, 3, ROW_H - 10);
    g.fillStyle = '#d7dce5';
    g.fillText('Y' + (r + 1), 12, y);
    if (preview) {
      g.fillStyle = '#7b8497';
      g.font = '9px ui-monospace,monospace';
      g.fillText('+' + (OFFSETS[r] / 10).toFixed(1) + 's', 34, y);
      g.font = 'bold 11px system-ui';
    }
  }
  if (preview) {
    g.fillStyle = '#67e8f9';
    g.font = 'bold 9px system-ui';
    g.fillText('WATER', 8, wy + 10);
    g.fillText('VIEW', 8, wy + 21);
    g.font = 'bold 11px system-ui';
  }
}

/* ---------- status ---------- */
function updateStatus() {
  $('timeStat').textContent = fmtTime(curTime());
  $('frameStat').textContent = curFrame();
}

/* ---------- auto-scroll during playback ---------- */
function autoScroll() {
  const w = scroller.clientWidth;
  const phx = frameToX(curTime() / FRAME_S);
  if (phx > w - 80) scroller.scrollLeft += phx - (w - 80);
  else if (phx < LABEL_W) scroller.scrollLeft = curTime() / FRAME_S * px - 40;
}

/* ---------- main loop ---------- */
function tick() {
  if (playing) {
    if (curTime() >= duration()) { pause(); pausedAt = duration(); }
    autoScroll();
  }
  draw();
  updateStatus();
  requestAnimationFrame(tick);
}

/* ---------- pointer interaction ---------- */
function hit(e) {
  const rect = cv.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const col = Math.floor((x - LABEL_W + scroller.scrollLeft) / px);
  const row = Math.floor((y - RULER_H - WAVE_H) / ROW_H);
  const zone = y < RULER_H + WAVE_H ? 'scrub' : 'grid';
  return { x, y, col, row, zone };
}

cv.addEventListener('contextmenu', e => e.preventDefault());

cv.addEventListener('pointerdown', e => {
  if (e.button !== 0 && e.button !== 2) return;
  const h = hit(e);
  if (h.x < LABEL_W) return;
  cv.setPointerCapture(e.pointerId);

  if (h.zone === 'scrub') {
    drag = { kind: 'scrub', wasPlaying: playing };
    if (playing) pause();
    setTime(((h.x - LABEL_W + scroller.scrollLeft) / px) * FRAME_S);
    return;
  }
  // grid edit
  if (h.row < 0 || h.row >= N || h.col < 0 || h.col >= displayFrames()) return;
  snapshot();
  let val;
  if (e.button === 2) val = 0;
  else if (mode === 'paint') val = 1;
  else if (mode === 'erase') val = 0;
  else val = cellOn(h.col, h.row) ? 0 : 1;
  setCell(h.col, h.row, val);
  drag = { kind: 'edit', val, lastCol: h.col, lastRow: h.row };
  if (!playing) setTime(h.col * FRAME_S);  // grid click also scrubs
});

cv.addEventListener('pointermove', e => {
  if (!drag) return;
  const h = hit(e);
  if (drag.kind === 'scrub') {
    setTime(((clamp(h.x, LABEL_W, 1e9) - LABEL_W + scroller.scrollLeft) / px) * FRAME_S);
    return;
  }
  if (h.row < 0 || h.row >= N) return;
  const col = clamp(h.col, 0, displayFrames() - 1);
  // fill every frame swept over on the current row so fast drags leave no gaps
  const from = h.row === drag.lastRow ? drag.lastCol : col;
  const lo = Math.min(from, col), hi = Math.max(from, col);
  for (let f = lo; f <= hi; f++) setCell(f, h.row, drag.val);
  drag.lastCol = col;
  drag.lastRow = h.row;
});

window.addEventListener('pointerup', () => {
  if (drag && drag.kind === 'scrub' && drag.wasPlaying) play();
  drag = null;
});

/* ctrl+wheel zoom anchored at cursor */
scroller.addEventListener('wheel', e => {
  if (!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  const rect = cv.getBoundingClientRect();
  setZoom(e.deltaY < 0 ? Math.round(px * 1.3 + .5) : Math.round(px / 1.3), e.clientX - rect.left);
}, { passive: false });

/* ---------- toolbar wiring ---------- */
$('btnAudio').onclick = () => $('fileAudio').click();
$('btnJson').onclick = () => $('fileJson').click();
$('fileAudio').onchange = e => { if (e.target.files[0]) loadAudioFile(e.target.files[0]); e.target.value = ''; };
$('fileJson').onchange = e => { if (e.target.files[0]) loadJsonFile(e.target.files[0]); e.target.value = ''; };
$('btnExport').onclick = exportJson;
$('btnClear').onclick = () => {
  if (!confirm('Clear all jet activations? (length is kept; Ctrl+Z restores)')) return;
  snapshot();
  timeline.forEach(r => r.fill(0));
};
$('btnPlay').onclick = togglePlay;
$('btnStop').onclick = stopAll;
$('btnUndo').onclick = undo;
$('btnRedo').onclick = redo;
$('btnZoomIn').onclick = () => setZoom(Math.round(px * 1.3 + .5));
$('btnZoomOut').onclick = () => setZoom(Math.round(px / 1.3));
$('btnExtend').onclick = () => { snapshot(); ensureLength(timeline.length + 100); layout(); };
$('chkPreview').onchange = e => { preview = e.target.checked; layout(); };

function setMode(m) {
  mode = m;
  for (const k of ['toggle','paint','erase'])
    $('mode' + k[0].toUpperCase() + k.slice(1)).classList.toggle('active', k === m);
}
$('modeToggle').onclick = () => setMode('toggle');
$('modePaint').onclick = () => setMode('paint');
$('modeErase').onclick = () => setMode('erase');

// keep Space for transport, not for re-triggering the last focused button
document.querySelectorAll('button, input[type=checkbox]').forEach(el =>
  el.addEventListener('click', () => el.blur()));

/* ---------- keyboard ---------- */
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') return;
  const k = e.key.toLowerCase();
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); stepFrame(e.shiftKey ? 10 : 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); stepFrame(e.shiftKey ? -10 : -1); }
  else if (e.key === 'Home') { e.preventDefault(); setTime(0); }
  else if (e.key === 'End') { e.preventDefault(); pause(); setTime(duration()); }
  else if ((e.ctrlKey || e.metaKey) && k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  else if ((e.ctrlKey || e.metaKey) && (k === 'y' || (k === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
  else if (k === '1') setMode('toggle');
  else if (k === '2') setMode('paint');
  else if (k === '3') setMode('erase');
});

/* ---------- go ---------- */
window.addEventListener('resize', layout);
layout();
updateUndoBtns();
requestAnimationFrame(tick);
</script>
</body>
</html>
